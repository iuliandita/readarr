name: Upstream watch

# Scans projects this fork shares code or lineage with and reports changes that
# may be worth porting. Sonarr shares the core; Chaptarr is a newer Readarr fork.
# Reports are posted as comments on one tracking issue per upstream.

on:
  schedule:
    # Mondays 06:17 UTC
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "7"

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch ${{ matrix.upstream.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        upstream:
          - name: sonarr
            owner: Sonarr
            repo: Sonarr
            trackingTitle: Sonarr upstream watch
            note: ""
            includePaths:
              - src/NzbDrone.Core/Download/Clients/
              - src/NzbDrone.Core/Indexers/
              - src/NzbDrone.Core/Parser/
              - src/NzbDrone.Core/MediaFiles/
              - src/NzbDrone.Core/Organizer/
              - src/NzbDrone.Core/HealthCheck/
              - src/NzbDrone.Core/Datastore/
              - src/NzbDrone.Core/Authentication/
              - src/NzbDrone.Core/Blocklisting/
              - src/NzbDrone.Common/
              - src/NzbDrone.Host/
              - src/Directory.Packages.props
              - Dockerfile
              - .github/workflows/
            excludePaths:
              - frontend/
              - src/NzbDrone.Core/ImportLists/
              - Translations/
          - name: chaptarr
            owner: Chaptarr
            repo: chaptarr
            trackingTitle: Chaptarr upstream watch
            note: "This fork keeps ebook and audiobook as separate instances. Skip Chaptarr changes tied to its combined ebook+audiobook library model."
            includePaths:
              - src/NzbDrone.Core/Download/Clients/
              - src/NzbDrone.Core/Indexers/
              - src/NzbDrone.Core/Parser/
              - src/NzbDrone.Core/MediaFiles/
              - src/NzbDrone.Core/Organizer/
              - src/NzbDrone.Core/HealthCheck/
              - src/NzbDrone.Core/Datastore/
              - src/NzbDrone.Core/Authentication/
              - src/NzbDrone.Core/Blocklisting/
              - src/NzbDrone.Core/MediaCover/
              - src/NzbDrone.Core/MetadataSource/
              - src/NzbDrone.Core/Notifications/
              - src/NzbDrone.Common/
              - src/NzbDrone.Host/
              - src/Directory.Packages.props
              - src/Chaptarr.Http/
              - src/Chaptarr.Api.V1/
              - Dockerfile
              - .github/workflows/
            excludePaths:
              - frontend/
              - src/NzbDrone.Core/ImportLists/
              - Translations/
    steps:
      - name: Scan and report
        uses: actions/github-script@v9
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '7' }}
          UPSTREAM: ${{ toJSON(matrix.upstream) }}
        with:
          script: |
            const cfg = JSON.parse(process.env.UPSTREAM);
            const days = parseInt(process.env.LOOKBACK_DAYS, 10) || 7;
            const since = new Date(Date.now() - days * 24 * 3600 * 1000).toISOString();
            const upstream = { owner: cfg.owner, repo: cfg.repo, sha: 'develop' };
            const here = { owner: context.repo.owner, repo: context.repo.repo };
            const TRACKING_TITLE = cfg.trackingTitle;
            const TRACKING_LABEL = 'upstream-watch';
            const securityRe = /(\bsecurity\b|\bcve\b|\bauth\b|password|credential|permission|vulnerab|\bharden\b|sanitiz|\btraversal\b|injection|\bssrf\b|\bxss\b|\btoken\b|reflection)/i;

            const commits = await github.paginate(github.rest.repos.listCommits, {
              ...upstream,
              since,
              per_page: 100
            });

            const candidates = [];
            for (const c of commits) {
              const message = (c.commit.message || '').split('\n')[0].trim();
              let files = [];
              try {
                const detail = await github.rest.repos.getCommit({ ...upstream, ref: c.sha });
                files = (detail.data.files || []).map(f => f.filename);
              } catch (e) {
                continue;
              }

              const relevant = files.filter(f => cfg.includePaths.some(p => f.includes(p)) && !cfg.excludePaths.some(p => f.includes(p)));
              if (relevant.length === 0) {
                continue;
              }

              candidates.push({
                sha: c.sha.substring(0, 10),
                message,
                url: c.html_url,
                files: relevant.slice(0, 4),
                security: securityRe.test(message) || relevant.some(f => f.includes('src/NzbDrone.Core/Authentication/'))
              });
            }

            candidates.sort((a, b) => Number(b.security) - Number(a.security));

            const lines = [];
            lines.push(`Upstream: https://github.com/${cfg.owner}/${cfg.repo}/commits/develop`);
            lines.push(`Scan window: last ${days} day(s), generated ${new Date().toISOString().replace('T', ' ').substring(0, 16)} UTC.`);
            if (cfg.note) {
              lines.push('');
              lines.push(`> ${cfg.note}`);
            }
            lines.push('');
            if (candidates.length === 0) {
              lines.push('No shared-core candidates found in this window.');
            } else {
              lines.push(`Found **${candidates.length}** candidate commit(s). Review each and open a port issue if it applies to books:`);
              lines.push('');
              for (const c of candidates.slice(0, 50)) {
                const tag = c.security ? '**[security]** ' : '';
                lines.push(`- ${tag}[\`${c.sha}\`](${c.url}) ${c.message} — \`${c.files.join('`, `')}\``);
              }
            }
            const body = lines.join('\n');

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${here.owner}/${here.repo} is:issue is:open in:title "${TRACKING_TITLE}"`
            });
            let issueNumber = search.data.items.length ? search.data.items[0].number : null;

            if (!issueNumber) {
              try {
                await github.rest.issues.getLabel({ ...here, name: TRACKING_LABEL });
              } catch (e) {
                await github.rest.issues.createLabel({ ...here, name: TRACKING_LABEL, color: 'ededed', description: 'Auto-generated upstream watch report' });
              }
              const created = await github.rest.issues.create({
                ...here,
                title: TRACKING_TITLE,
                labels: [TRACKING_LABEL],
                body: `Reports from the \`Upstream watch\` workflow for ${cfg.owner}/${cfg.repo}. Each report lists recent commits that touch shared-core areas; open a port issue for anything worth adopting.`
              });
              issueNumber = created.data.number;
            }

            await github.rest.issues.createComment({ ...here, issue_number: issueNumber, body });
            core.notice(`Reported ${candidates.length} candidate(s) on issue #${issueNumber}.`);

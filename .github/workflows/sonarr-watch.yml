name: Sonarr upstream watch

# Scans Sonarr for changes that may be worth porting into this fork and reports
# them on a tracking issue. Sonarr is the upstream this project shares its core
# with; keeping an eye on it is how security and reliability fixes get found.

on:
  schedule:
    # Mondays 06:17 UTC
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "7"

permissions:
  contents: read
  issues: write

concurrency:
  group: sonarr-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Scan Sonarr for portable changes
    runs-on: ubuntu-latest
    steps:
      - name: Scan and report
        uses: actions/github-script@v9
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '7' }}
        with:
          script: |
            const days = parseInt(process.env.LOOKBACK_DAYS, 10) || 7;
            const since = new Date(Date.now() - days * 24 * 3600 * 1000).toISOString();
            const upstream = { owner: 'Sonarr', repo: 'Sonarr', sha: 'develop' };
            const here = { owner: context.repo.owner, repo: context.repo.repo };
            const TRACKING_TITLE = 'Sonarr upstream watch';
            const TRACKING_LABEL = 'upstream-watch';

            // Shared-core areas worth watching. Series/episode and frontend
            // changes are intentionally out of scope for this fork.
            const includePaths = [
              'src/NzbDrone.Core/Download/Clients/',
              'src/NzbDrone.Core/Indexers/',
              'src/NzbDrone.Core/Parser/',
              'src/NzbDrone.Core/MediaFiles/',
              'src/NzbDrone.Core/Organizer/',
              'src/NzbDrone.Core/HealthCheck/',
              'src/NzbDrone.Core/Datastore/',
              'src/NzbDrone.Core/Authentication/',
              'src/NzbDrone.Core/Blocklisting/',
              'src/NzbDrone.Common/',
              'src/NzbDrone.Host/',
              'src/Directory.Packages.props',
              'Dockerfile',
              '.github/workflows/'
            ];
            const excludePaths = ['frontend/', 'src/NzbDrone.Core/ImportLists/', 'Translations/'];
            const securityRe = /(security|cve|auth|password|credential|permission|vulnerab|harden|sanitiz|traversal|injection|ssrf|xss|token|reflection)/i;

            const commits = await github.paginate(github.rest.repos.listCommits, {
              ...upstream,
              since,
              per_page: 100
            });

            const candidates = [];
            for (const c of commits) {
              const message = (c.commit.message || '').split('\n')[0].trim();
              let files = [];
              try {
                const detail = await github.rest.repos.getCommit({ ...upstream, ref: c.sha });
                files = (detail.data.files || []).map(f => f.filename);
              } catch (e) {
                continue;
              }

              const relevant = files.filter(f => includePaths.some(p => f.includes(p)) && !excludePaths.some(p => f.includes(p)));
              if (relevant.length === 0) {
                continue;
              }

              candidates.push({
                sha: c.sha.substring(0, 10),
                message,
                url: c.html_url,
                files: relevant.slice(0, 4),
                security: securityRe.test(message) || relevant.some(f => /Authentication|Datastore|Host/.test(f))
              });
            }

            candidates.sort((a, b) => Number(b.security) - Number(a.security));

            const lines = [];
            lines.push(`Scan window: last ${days} day(s), generated ${new Date().toISOString().replace('T', ' ').substring(0, 16)} UTC.`);
            lines.push(`Upstream: https://github.com/Sonarr/Sonarr/commits/develop`);
            lines.push('');
            if (candidates.length === 0) {
              lines.push('No shared-core candidates found in this window.');
            } else {
              lines.push(`Found **${candidates.length}** candidate commit(s). Review each and open a port issue if it applies to books:`);
              lines.push('');
              for (const c of candidates.slice(0, 50)) {
                const tag = c.security ? '**[security]** ' : '';
                lines.push(`- ${tag}[\`${c.sha}\`](${c.url}) ${c.message} — \`${c.files.join('`, `')}\``);
              }
            }
            const body = lines.join('\n');

            // Find or create the tracking issue.
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${here.owner}/${here.repo} is:issue is:open in:title "${TRACKING_TITLE}"`
            });
            let issueNumber = search.data.items.length ? search.data.items[0].number : null;

            if (!issueNumber) {
              try {
                await github.rest.issues.getLabel({ ...here, name: TRACKING_LABEL });
              } catch (e) {
                await github.rest.issues.createLabel({ ...here, name: TRACKING_LABEL, color: 'ededed', description: 'Auto-generated upstream watch report' });
              }
              const created = await github.rest.issues.create({
                ...here,
                title: TRACKING_TITLE,
                labels: [TRACKING_LABEL],
                body: 'Weekly reports from the `Sonarr upstream watch` workflow. Each report lists recent Sonarr commits that touch shared-core areas; open a port issue for anything worth adopting.'
              });
              issueNumber = created.data.number;
            }

            await github.rest.issues.createComment({ ...here, issue_number: issueNumber, body });
            core.notice(`Reported ${candidates.length} candidate(s) on issue #${issueNumber}.`);
